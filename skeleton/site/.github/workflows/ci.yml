name: CI

on:
  push:
    branches: [main]
  pull_request:

# No deploy job. Cloudflare Workers Builds deploys from the repo on its own;
# wiring that up is HANDOFF.md, step C1.

jobs:
  build:
    name: typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  tokens:
    name: no hardcoded design tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/no-hardcoded-tokens.sh

{{SCHEMA_JOB}}
