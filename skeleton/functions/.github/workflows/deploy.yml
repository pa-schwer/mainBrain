name: Deploy

# main deploys to staging. prod deploys to prod, and prod only ever moves by
# fast-forward from a main commit the founder tested on staging. See
# {{PROJECT}}-ops/docs/workflow.md.

on:
  push:
    branches: [main, prod]

# One deploy per target at a time, and a queued one waits rather than
# cancelling: a cancelled firebase deploy can leave half the functions on
# the old version.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy ${{ github.ref_name == 'prod' && 'prod' || 'staging' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # Workload Identity Federation: GitHub mints the OIDC token Google trusts
    env:
      TARGET: ${{ github.ref_name == 'prod' && 'prod' || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm test

      # No key exists. Each project trusts this repository's OIDC token for
      # one branch: staging for main, prod for prod. A provider put in the
      # wrong variable cannot reach the other project's deploy account, so a
      # swap fails red at the deploy's first Google call (the auth step only
      # writes the credential file) and never deploys to the wrong project.
      - name: Require the deploy identity
        env:
          WIF_STAGING: ${{ vars.GCP_WIF_PROVIDER_STAGING }}
          WIF_PROD: ${{ vars.GCP_WIF_PROVIDER_PROD }}
        run: |
          if [ "${TARGET}" = prod ]; then
            provider="${WIF_PROD}"; name=GCP_WIF_PROVIDER_PROD; project={{FIREBASE_PROD}}
          else
            provider="${WIF_STAGING}"; name=GCP_WIF_PROVIDER_STAGING; project={{FIREBASE_STAGING}}
          fi

          if [ -z "${provider}" ]; then
            echo "${name} is not set, so nothing can be deployed to ${TARGET}."
            echo
            echo "Fix: HANDOFF.md, step F4. mainBrain's provisioning run sets this"
            echo "repository variable. By hand, its value is the Workload Identity"
            echo "provider of ${project}:"
            echo "projects/<project number>/locations/global/workloadIdentityPools/github/providers/github"
            echo
            echo "This step fails rather than skips."
            exit 1
          fi

          echo "WIF_PROVIDER=${provider}" >> "${GITHUB_ENV}"
          echo "DEPLOY_SA=github-deploy@${project}.iam.gserviceaccount.com" >> "${GITHUB_ENV}"

      - name: Authenticate to Google Cloud (no key, OIDC from this run)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      # firebase.json is the project's Firebase configuration: functions,
      # Firestore rules and indexes, Storage rules, sign-in providers.
      # firebase-tools is pinned: 15 is the first major that deploys `auth`,
      # and 15.17 to 15.22.2 failed to authenticate through Workload Identity
      # Federation.
      - name: Deploy functions, rules, indexes and sign-in providers
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: |
          npx --yes firebase-tools@15.32.1 deploy \
            --only functions,firestore,storage,auth \
            --project "${TARGET}" \
            --non-interactive --force

      # A first deploy on a fresh project can exit 0 with one function never
      # created: parallel creates race to make the sources bucket, one loses
      # with a 409, and the CLI reports it as a warning. Green has to mean
      # every function that src/index.ts exports is live, so this step asks
      # the project and compares.
      - name: Verify every exported function is deployed
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: |
          expected=$(grep -oE '^export \{ [A-Za-z0-9_]+ \}' src/index.ts \
            | sed -E 's/export \{ ([A-Za-z0-9_]+) \}/\1/' | sort)
          deployed=$(npx --yes firebase-tools@15.32.1 functions:list \
            --project "${TARGET}" --json \
            | jq -r '.result[].id' | sort)

          echo "expected:"; echo "${expected}" | sed 's/^/  /'
          echo "deployed:"; echo "${deployed}" | sed 's/^/  /'

          missing=$(comm -23 <(echo "${expected}") <(echo "${deployed}"))
          if [ -n "${missing}" ]; then
            echo
            echo "Not deployed on ${TARGET}:"
            echo "${missing}" | sed 's/^/  /'
            echo
            echo "Re-run this workflow. A first deploy on a fresh project can"
            echo "lose one function to a bucket-creation race; the second"
            echo "run finds the bucket in place. If the same function is"
            echo "missing twice, read the deploy step's log for it."
            exit 1
          fi
          echo "all exported functions are deployed on ${TARGET}"
