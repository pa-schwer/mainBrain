name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the deploy runtime in firebase.json. Testing on a
          # different major than the one Cloud Functions runs would prove
          # the wrong thing.
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

